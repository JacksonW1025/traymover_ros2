collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    # The supervisor publishes the final /cmd_vel command. Keeping the
    # collision monitor output separate lets the prototype release only the
    # safety stop after the sustained hold and still honor a hardware e-stop.
    cmd_vel_out_topic: cmd_vel_safety
    transform_tolerance: 0.3
    source_timeout: 1.0
    stop_pub_timeout: 0.5
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: polygon
      # Cover the whole near-field strip. A thin 0.40--0.72 m slice would
      # release the stop again once a box entered its inner edge.
      points: "[[0.00, 0.35], [0.90, 0.35], [0.90, -0.35], [0.00, -0.35]]"
      action_type: stop
      min_points: 6
      visualize: true
      polygon_pub_topic: polygon_stop
    PolygonSlow:
      type: polygon
      points: "[[0.20, 0.50], [1.40, 0.50], [1.40, -0.50], [0.20, -0.50]]"
      action_type: slowdown
      min_points: 4
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: polygon_slowdown
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
