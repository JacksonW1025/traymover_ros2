# Nav2 parameters for the Gazebo detour demonstration.
# Every node uses simulated time.  AMCL supplies map -> odom from /scan while
# sim_odom_tf supplies odom -> base_link from the Gazebo odometry stream.

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.05
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    set_initial_pose: true
    sigma_hit: 0.2
    spatial_resolution: 0.5
    tf_broadcast: true
    transform_tolerance: 0.6
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    initial_pose:
      x: 1.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # Planning is asynchronous and can exceed the upstream 20 ms default when
    # Gazebo is rendering a video scene. Give ComputePathToPose enough margin
    # to avoid aborting an otherwise valid navigation goal.
    default_server_timeout: 500
    transform_tolerance: 0.6
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.30
      movement_time_allowance: 45.0
    goal_checker_plugins: [general_goal_checker]
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      # Intermediate detour poses are route anchors, not final docking poses.
      # A wide demo-only heading tolerance prevents RPP (with rotate-to-
      # heading disabled) from orbiting an anchor after its XY is reached.
      yaw_goal_tolerance: 1.00
    controller_plugins: [FollowPath]
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # The video demo uses twice the original 0.10 m/s cruise speed. Keep
      # angular speed unchanged so the detour corner remains easy to see.
      desired_linear_vel: 0.20
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_velocity_scaled_lookahead_dist: true
      # Keep a long carrot and track continuously through the detour corner.
      # The short-carrot variant produced excessive curvature and an almost
      # complete in-place turn as the entry leg met the side leg.
      lookahead_dist: 1.40
      min_lookahead_dist: 1.10
      max_lookahead_dist: 2.60
      lookahead_time: 2.80
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.45
      max_angular_accel: 0.8
      allow_reversing: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 3.20
      regulated_linear_scaling_min_speed: 0.07
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: false
      transform_tolerance: 0.6
      max_robot_pose_search_dist: 10.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.6
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.40, -0.275], [-0.40, 0.275], [0.40, 0.275], [0.40, -0.275]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_min_range: 0.05
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.6
      footprint: "[[-0.40, -0.275], [-0.40, 0.275], [0.40, 0.275], [0.40, -0.275]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan_global
        scan_global:
          topic: /scan_global
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_min_range: 0.05
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # The explicit detour anchors already keep the robot clear of the
        # temporary box. Keep the global inflation at the original demo value
        # so the close y=+/-1.20 m side corridor remains a straight corridor.
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.50
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
