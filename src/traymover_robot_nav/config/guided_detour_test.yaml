# Option 19: direct LiDAR/odom forward drive, one bypass, and line return.
guided_detour_test:
  ros__parameters:
    wait_before_detour_sec: 0.20
    detour_trigger_distance_m: 2.00
    detour_guard_distance_m: 0.95
    detour_target_clearance_m: 1.15
    clear_confirm_sec: 0.10
    stop_settle_time_sec: 0.10
    detour_turn_angle_deg: 45.0
    detour_first_leg_m: 1.20
    detour_forward_leg_m: 1.00
    detour_max_linear_speed: 0.08
    detour_max_angular_speed: 0.25
    forward_speed: 0.05
    return_forward_m: 0.80
    line_tolerance_m: 0.10
    heading_tolerance_deg: 5.0
    turn_phase_timeout_sec: 12.0
    straight_phase_timeout_sec: 30.0
    scan_timeout_sec: 1.0
    realsense_timeout_sec: 1.0
    odom_timeout_sec: 0.5
    max_test_duration_sec: 240.0
