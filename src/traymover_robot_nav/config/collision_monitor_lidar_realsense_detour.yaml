collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    # Simple detour evaluates fresh scans in the robot's local frame. Humble CM
    # otherwise asks odom for base@now, ahead of the latest measured odometry,
    # and can discard both sensors after a future-extrapolation timeout. Using
    # the base as the fixed frame keeps static sensor extrinsics usable without
    # motion compensation; the supervisor retains per-source freshness stops.
    odom_frame_id: "base_link"
    cmd_vel_in_topic: "cmd_vel_detour"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.3
    source_timeout: 1.5
    stop_pub_timeout: 0.5

    # Camera returns in this close front region still stop immediately. The
    # supervisor confirms farther camera obstacles before starting a detour;
    # LiDAR checks maneuver clearance there, without braking normal navigation
    # for unrelated side/high returns. Avoid a separate distant slowdown region.
    polygons: ["PolygonStop"]

    PolygonStop:
      type: "polygon"
      points: [0.40, 0.32, 0.75, 0.32, 0.75, -0.32, 0.40, -0.32]
      action_type: "stop"
      min_points: 6
      visualize: true
      polygon_pub_topic: "polygon_stop"

    observation_sources: ["realsense_scan"]
    realsense_scan:
      type: "scan"
      topic: "/scan_realsense"
      enabled: true
