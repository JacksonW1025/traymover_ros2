collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.3
    source_timeout: 1.0
    stop_pub_timeout: 0.5

    # Option 16 safety layer. RealSense sits nearer waist height and is the
    # primary near-field source for low boxes, stools, cables, and carts that
    # the high LiDAR may miss. LiDAR remains a high-mounted auxiliary source
    # for adults / upper-body obstacles. Keep the geometry simple for v1.
    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      points: [0.40, 0.32, 0.75, 0.32, 0.75, -0.32, 0.40, -0.32]
      action_type: "stop"
      min_points: 6
      visualize: true
      polygon_pub_topic: "polygon_stop"

    PolygonSlow:
      type: "polygon"
      points: [0.40, 0.45, 1.40, 0.45, 1.40, -0.45, 0.40, -0.45]
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "polygon_slowdown"

    observation_sources: ["realsense_scan", "lidar_scan"]
    realsense_scan:
      type: "scan"
      topic: "/scan_realsense"
      enabled: true

    lidar_scan:
      type: "scan"
      topic: "/scan"
      enabled: true
