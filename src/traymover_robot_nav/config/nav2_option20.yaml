# Option 20: AMCL + measured LiDAR/IMU odometry; unknown cells stay blocked.
# Ground-only finite returns clear old dynamic marks; collision clouds only mark.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.6
    default_nav_to_pose_bt_xml: ''
    default_nav_through_poses_bt_xml: ''
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: traymover_robot_nav::YawProgressChecker
      required_movement_radius: 0.3
      required_movement_angle: 0.2
      movement_time_allowance: 90.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.14
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.6
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.5
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.65
      lookahead_time: 1.5
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.25
      max_angular_accel: 0.4
      allow_reversing: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 3.2
      regulated_linear_scaling_min_speed: 0.035
      use_cost_regulated_linear_velocity_scaling: true
      use_collision_detection: true
      transform_tolerance: 0.6
      max_robot_pose_search_dist: 10.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      max_allowed_time_to_collision_up_to_carrot: 2.0
      cost_scaling_dist: 0.5
      cost_scaling_gain: 0.5
      inflation_cost_scaling_factor: 3.0
    robot_base_frame: base_footprint
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      footprint: '[[-0.40, -0.275], [-0.40, 0.275], [0.40, 0.275], [0.40, -0.275]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
      always_send_full_costmap: true
      track_unknown_space: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar depth lidar_clear depth_clear
        min_obstacle_height: 0.12
        max_obstacle_height: 2.3
        combination_method: 1
        footprint_clearing_enabled: true
        lidar:
          topic: /option20/lidar_obstacles
          data_type: PointCloud2
          sensor_frame: laser
          marking: true
          clearing: false
          min_obstacle_height: 0.12
          max_obstacle_height: 2.3
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.5
          raytrace_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth:
          topic: /option20/depth_obstacles
          data_type: PointCloud2
          sensor_frame: camera_depth_optical_frame
          marking: true
          clearing: false
          min_obstacle_height: 0.12
          max_obstacle_height: 2.3
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
        lidar_clear:
          topic: /option20/lidar_clearing
          data_type: PointCloud2
          sensor_frame: laser
          marking: false
          clearing: true
          min_obstacle_height: -0.1
          max_obstacle_height: 0.12
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.5
          raytrace_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth_clear:
          topic: /option20/depth_clearing
          data_type: PointCloud2
          sensor_frame: camera_depth_optical_frame
          marking: false
          clearing: true
          min_obstacle_height: -0.1
          max_obstacle_height: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      use_sim_time: false
      footprint: '[[-0.40, -0.275], [-0.40, 0.275], [0.40, 0.275], [0.40, -0.275]]'
      resolution: 0.1
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar depth lidar_clear depth_clear
        min_obstacle_height: 0.12
        max_obstacle_height: 2.3
        combination_method: 1
        footprint_clearing_enabled: true
        lidar:
          topic: /option20/lidar_obstacles
          data_type: PointCloud2
          sensor_frame: laser
          marking: true
          clearing: false
          min_obstacle_height: 0.12
          max_obstacle_height: 2.3
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.5
          raytrace_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth:
          topic: /option20/depth_obstacles
          data_type: PointCloud2
          sensor_frame: camera_depth_optical_frame
          marking: true
          clearing: false
          min_obstacle_height: 0.12
          max_obstacle_height: 2.3
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
        lidar_clear:
          topic: /option20/lidar_clearing
          data_type: PointCloud2
          sensor_frame: laser
          marking: false
          clearing: true
          min_obstacle_height: -0.1
          max_obstacle_height: 0.12
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.5
          raytrace_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth_clear:
          topic: /option20/depth_clearing
          data_type: PointCloud2
          sensor_frame: camera_depth_optical_frame
          marking: false
          clearing: true
          min_obstacle_height: -0.1
          max_obstacle_height: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
          raytrace_max_range: 5.5
          raytrace_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.2
      use_astar: false
      allow_unknown: false
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan_localization
    map_topic: /localization_map
    set_initial_pose: false
    always_reset_initial_pose: true
    tf_broadcast: true
    transform_tolerance: 0.3
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    laser_model_type: likelihood_field_prob
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    laser_min_range: 0.5
    laser_max_range: 50.0
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.8
    z_rand: 0.2
    update_min_d: 0.04
    update_min_a: 0.04
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: -1.0
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    cycle_frequency: 10.0
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors/Wait
