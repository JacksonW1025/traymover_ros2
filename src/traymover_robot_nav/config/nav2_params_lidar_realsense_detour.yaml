# Option 18 additive obstacle layers only.
# All navigation settings are loaded from the same nav2_params.yaml as option 10.
# The launch inserts these layers before inflation without replacing baseline plugins.
local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar_scan realsense_scan
        min_obstacle_height: -0.2
        max_obstacle_height: 2.0
        lidar_scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.3
          raytrace_max_range: 8.0
          raytrace_min_range: 0.3
          max_obstacle_height: 2.0
        realsense_scan:
          topic: /scan_realsense
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.2
          raytrace_max_range: 3.2
          raytrace_min_range: 0.2
          max_obstacle_height: 1.5
global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar_scan realsense_scan
        min_obstacle_height: -0.2
        max_obstacle_height: 2.0
        lidar_scan:
          topic: /scan
          data_type: LaserScan
          observation_persistence: 5.0
          inf_is_valid: true
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.3
          raytrace_max_range: 8.0
          raytrace_min_range: 0.3
          max_obstacle_height: 2.0
        realsense_scan:
          topic: /scan_realsense
          data_type: LaserScan
          observation_persistence: 5.0
          inf_is_valid: true
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.2
          raytrace_max_range: 3.2
          raytrace_min_range: 0.2
          max_obstacle_height: 1.5
