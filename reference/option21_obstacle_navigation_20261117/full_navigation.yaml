behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors/BackUp
    behavior_plugins:
    - spin
    - backup
    - wait
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 10.0
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    max_rotational_vel: 0.6
    min_rotational_vel: 0.15
    robot_base_frame: base_link
    rotational_acc_lim: 1.5
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors/Spin
    transform_tolerance: 0.6
    use_sim_time: true
    wait:
      plugin: nav2_behaviors/Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_nav_through_poses_bt_xml: ''
    default_nav_to_pose_bt_xml: ''
    default_server_timeout: 20
    global_frame: map
    odom_topic: /odom
    robot_base_frame: base_link
    transform_tolerance: 0.6
    use_sim_time: false
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    FollowPath:
      BaseObstacle.scale: 0.02
      GoalAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalDist.scale: 24.0
      ObstacleFootprint.scale: 1.0
      PathAlign.forward_point_distance: 0.1
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      acc_lim_theta: 1.5
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      angular_granularity: 0.025
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      debug_trajectory_details: false
      decel_lim_theta: -1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      linear_granularity: 0.05
      max_speed_xy: 0.35
      max_vel_theta: 0.6
      max_vel_x: 0.35
      max_vel_y: 0.0
      min_speed_theta: 0.0
      min_speed_xy: 0.0
      min_vel_x: 0.0
      min_vel_y: 0.0
      plugin: dwb_core::DWBLocalPlanner
      publish_local_plan: true
      publish_trajectories: true
      short_circuit_trajectory_evaluation: true
      sim_time: 1.7
      stateful: true
      trans_stopped_velocity: 0.03
      transform_tolerance: 0.6
      vtheta_samples: 24
      vx_samples: 12
      vy_samples: 1
      xy_goal_tolerance: 0.2
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 2.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.3
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    odom_topic: /odom
    progress_checker:
      movement_time_allowance: 45.0
      plugin: traymover_robot_nav::YawProgressChecker
      required_movement_angle: 0.2
      required_movement_radius: 0.3
    progress_checker_plugin: progress_checker
    use_sim_time: false
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.40, -0.275], [-0.40, 0.275], [0.40, 0.275], [0.40, -0.275]]'
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 2.0
        inflation_radius: 1.2
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        footprint_clearing_enabled: true
        lidar:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.2
          min_obstacle_height: 0.1
          obstacle_max_range: 12.0
          obstacle_min_range: 0.3
          raytrace_max_range: 18.0
          raytrace_min_range: 0.3
          sensor_frame: laser
          topic: /point_cloud_nav
        observation_sources: lidar
        plugin: nav2_costmap_2d::ObstacleLayer
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_link
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      transform_tolerance: 0.6
      update_frequency: 1.0
      use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.40, -0.275], [-0.40, 0.275], [0.40, 0.275], [0.40, -0.275]]'
      global_frame: odom
      height: 6
      inflation_layer:
        cost_scaling_factor: 2.0
        inflation_radius: 1.2
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        footprint_clearing_enabled: true
        lidar:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.2
          min_obstacle_height: 0.1
          obstacle_max_range: 12.0
          obstacle_min_range: 0.3
          raytrace_max_range: 18.0
          raytrace_min_range: 0.3
          sensor_frame: laser
          topic: /point_cloud_nav
        observation_sources: lidar
        plugin: nav2_costmap_2d::ObstacleLayer
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      transform_tolerance: 0.6
      update_frequency: 5.0
      use_sim_time: false
      width: 6
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
    expected_planner_frequency: 10.0
    planner_plugins:
    - GridBased
    use_sim_time: false
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: false
